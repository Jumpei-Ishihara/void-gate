const Assets = (()=>{
  // 岩の頂点変位(seed付き再現性): 大起伏(sin合成) + クレーター凹み(AST-01/02)
  function deformRock(geo, seed){
    let s = seed>>>0;
    const rnd = ()=>((s = (s*1664525 + 1013904223)>>>0) / 4294967296);
    const dirs = [], amp = [], ph = [];
    for(let i = 0; i < 4; i++){
      dirs.push(new THREE.Vector3(rnd()*4-2, rnd()*4-2, rnd()*4-2));
      ph.push(rnd()*6.283); amp.push(.05 + .09*rnd());
    }
    const craters = [];
    const nC = 4 + Math.floor(rnd()*4);
    for(let i = 0; i < nC; i++) craters.push({
      d: new THREE.Vector3(rnd()-.5, rnd()-.5, rnd()-.5).normalize(),
      depth: .07 + .09*rnd(), cos: .80 + .08*rnd()});
    const pos = geo.attributes.position, v = new THREE.Vector3();
    for(let i = 0; i < pos.count; i++){
      v.fromBufferAttribute(pos, i);
      const n = v.clone().normalize();
      let k = 1;
      for(let j = 0; j < 4; j++) k += amp[j]*Math.sin(n.dot(dirs[j])*3 + ph[j]);
      for(const c of craters){
        const d = n.dot(c.d);
        if(d > c.cos) k -= c.depth*((d - c.cos)/(1 - c.cos));
      }
      v.setLength(Math.max(.4, k));
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }
  // プロシージャル岩テクスチャ(AST-03): 明暗斑 + クレーター錯覚スポット + 粒状ノイズ
  function makeRockTex(size){
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const g = cv.getContext('2d');
    g.fillStyle = '#8d8d94'; g.fillRect(0, 0, size, size);
    for(let o = 0; o < 4; o++){
      const n = 26<<o, cell = size/Math.sqrt(n);
      for(let i = 0; i < n; i++){
        const a = .05/(o+1);
        g.fillStyle = Math.random() < .5 ? `rgba(255,255,255,${a})` : `rgba(0,0,10,${a*1.4})`;
        g.beginPath();
        g.arc(Math.random()*size, Math.random()*size, cell*(.4+Math.random()*.8), 0, 7);
        g.fill();

    for(let i = 0; i < 34; i++){   // 暗スポット(クレーター錯覚)
      const x = Math.random()*size, y = Math.random()*size, r = size*(.015+Math.random()*.045);
      const rg = g.createRadialGradient(x, y, r*.2, x, y, r);
      rg.addColorStop(0, 'rgba(0,0,8,.34)'); rg.addColorStop(.75, 'rgba(0,0,8,.12)'); rg.addColorStop(1, 'rgba(0,0,8,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    const id = g.getImageData(0, 0, size, size), d = id.data;   // 微細粒
    for(let i = 0; i < d.length; i += 4){

  // 同一マテリアル前提の静的ジオメトリ結合(draw call削減, CPT-06)
  function mergeGeo(parts){
    const geos = parts.map(({g, p=[0,0,0], r=[0,0,0]})=>{
      const o = new THREE.Object3D();
      o.position.set(...p); o.rotation.set(...r);
      o.updateMatrix();
      return g.toNonIndexed().applyMatrix4(o.matrix);
    });
    let total = 0; geos.forEach(g=>total += g.attributes.position.count);
    const pos = new Float32Array(total*3), nor = new Float32Array(total*3);
    let off = 0;
    for(const g of geos){
      pos.set(g.attributes.position.array, off*3);
      nor.set(g.attributes.normal.array, off*3);
      off += g.attributes.position.count;
      g.dispose();
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    return out;
  }

  let _rockGeos = null, _rockMats = null, _coreShared = null;
  function rockGeos(){
    if(!_rockGeos){
      _rockGeos = [];

        _rockGeos.push(deformRock(new THREE.IcosahedronGeometry(1, IS_TOUCH ? 2 : 3), 1000 + g*77));
    }

  }

    halo.scale.set(9, 9, 1);

    const ring2 = new THREE.Mesh(_coreShared.ringB, _coreShared.matB); ring2.rotation.z = .9;
    m.add(halo, ring1, ring2);
    m.userData.ring1 = ring1; m.userData.ring2 = ring2;
    return m;
  }
  // 機体一式(SPEC-05 SHP仕様と同一)。partsは装飾更新用の参照
  function buildShip(){
    const hull = new THREE.MeshStandardMaterial({color:0xbfd8ff, metalness:.85, roughness:.35, emissive:0x16335f});
    const group = new THREE.Group();
    const nose = new THREE.Mesh(new THREE.ConeGeometry(1.3, 5.2, 4), hull);
    nose.rotation.x = -Math.PI/2;
    const wing = new THREE.Mesh(new THREE.BoxGeometry(7.5, .3, 2.4), hull);
    wing.position.set(0, -.4, 1.2);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(.3, 2.4, 1.8), hull);
    fin.position.set(0, .9, 1.6);
    const eng = new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, color:0x00f0ff, blending:THREE.AdditiveBlending, depthWrite:false}));
    eng.scale.set(4, 4, 1); eng.position.set(0, 0, 3.2);
    group.add(nose, wing, fin, eng);
    const nozzles = new THREE.Mesh(mergeGeo([
      {g:new THREE.CylinderGeometry(.42, .58, 1.3, 12), p:[-1.6, -.15, 2.6], r:[Math.PI/2, 0, 0]},
      {g:new THREE.CylinderGeometry(.42, .58, 1.3, 12), p:[ 1.6, -.15, 2.6], r:[Math.PI/2, 0, 0]},
    ]), hull);
    const nozzleGlow = new THREE.Mesh(mergeGeo([
      {g:new THREE.CircleGeometry(.34, 14), p:[-1.6, -.15, 3.28]},
      {g:new THREE.CircleGeometry(.34, 14), p:[ 1.6, -.15, 3.28]},
    ]), new THREE.MeshBasicMaterial({color:0x7df1ff, transparent:true, opacity:.9,
      blending:THREE.AdditiveBlending, depthWrite:false}));
    const exMat = new THREE.SpriteMaterial({map:starTex, color:0x66e8ff, transparent:true,
      opacity:.55, blending:THREE.AdditiveBlending, depthWrite:false});
    const ex1 = new THREE.Sprite(exMat), ex2 = new THREE.Sprite(exMat);
    ex1.position.set(-1.6, -.15, 4.0); ex2.position.set(1.6, -.15, 4.0);
    const tipL = new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, color:0xff4455,
      transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false}));
    const tipR = new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, color:0x55ff88,
      transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false}));
    tipL.position.set(-3.75, -.4, 1.2); tipR.position.set(3.75, -.4, 1.2);
    tipL.scale.setScalar(1.1); tipR.scale.setScalar(1.1);
    group.add(nozzles, nozzleGlow, ex1, ex2, tipL, tipR);
    return {group, parts:{nozzles, nozzleGlow, exhaust:[ex1, ex2], tips:[tipL, tipR]}};
  }
  return {deformRock, makeRockTex, mergeGeo, rockGeos, rockMats, buildCore, buildShip};
})();

})();

const Look = (()=>{
  const LOOK = {keyDir: new THREE.Vector3(-60, 35, 40), keyColor: 0xfff0dc, keyI: 7.5,
                hemiSky: 0x2a3e66, hemiGround: 0x0a0710, hemiI: .9,
                rimDir: new THREE.Vector3(40, 18, -70), rimColor: 0x6fb8ff, rimI: 2.4,

  // 恒星の輝点+ハロー+淡い星雲を持つ手続き的な空を PMREM で映り込み用に変換(外部HDRI不要)
  function spaceEnv(renderer, keyDir = LOOK.keyDir){
    const sc = new THREE.Scene();
    const geo = new THREE.SphereGeometry(10, 64, 32);
    const mat = new THREE.ShaderMaterial({side: THREE.BackSide, depthWrite: false,
      uniforms: {kd: {value: keyDir.clone().normalize()}},
      vertexShader: `varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.); }`,
      fragmentShader: `uniform vec3 kd; varying vec3 vd;
        void main(){ vec3 d = normalize(vd); float k = max(dot(d, kd), 0.);
          vec3 c = vec3(.006, .008, .018);
          c += vec3(1., .93, .82)*pow(k, 900.)*60.;
          c += vec3(1., .85, .7)*pow(k, 24.)*.35;
          c += vec3(.25, .12, .45)*smoothstep(.2, 1., d.y*.5 + .5)*.05;
          c += vec3(0., .25, .35)*smoothstep(.4, 1., -d.x)*.03;
          gl_FragColor = vec4(c, 1.); }`});
    sc.add(new THREE.Mesh(geo, mat));
    const pm = new THREE.PMREMGenerator(renderer);
    const rt = pm.fromScene(sc, .02);
    pm.dispose(); geo.dispose(); mat.dispose();
    return rt.texture;
  }
  function rig(scene, o = {}){
    const hemi = new THREE.HemisphereLight(LOOK.hemiSky, LOOK.hemiGround, o.hemiI ?? LOOK.hemiI);
    const key = new THREE.DirectionalLight(LOOK.keyColor, o.keyI ?? LOOK.keyI);
    key.position.copy(o.keyDir || LOOK.keyDir);
    const rim = new THREE.DirectionalLight(LOOK.rimColor, o.rimI ?? LOOK.rimI);
    rim.position.copy(o.rimDir || LOOK.rimDir);
    scene.add(hemi, key, key.target, rim);
    return {hemi, key, rim};
  }
  // three r160 の ACESFilmicToneMapping と同一式(線形→線形0..1)。仕上げ効果はF6で追加
  // SPEC-09f F6-10: 仕上げ(ビネット・粒状ノイズ・周辺の色収差)を ACES の後に適用。
  // 粒状ノイズは知覚空間(≒sRGB)で加え、暗部だけが荒れないようにする。encode=1 は最終パス用(sRGB化まで行う)
  const GradeShader = {
    uniforms: {tDiffuse: {value: null}, exposure: {value: LOOK.exposure},
               vig: {value: .32}, grain: {value: .016}, ca: {value: .0016}, time: {value: 0}, encode: {value: 0}},
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float exposure, vig, grain, ca, time, encode; varying vec2 vUv;
      vec3 vgRRTODT(vec3 v){ vec3 a = v*(v + .0245786) - .000090537; vec3 b = v*(.983729*v + .4329510) + .238081; return a/b; }
      vec3 vgAces(vec3 c){
        const mat3 I = mat3(vec3(.59719, .07600, .02840), vec3(.35458, .90834, .13383), vec3(.04823, .01566, .83777));
        const mat3 O = mat3(vec3(1.60475, -.10208, -.00327), vec3(-.53108, 1.10813, -.07276), vec3(-.07367, -.00605, 1.07602));
        c *= exposure/.6; c = I*c; c = vgRRTODT(c); c = O*c; return clamp(c, 0., 1.); }
      float vgHash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
      vec3 vgSrgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1./2.4)) - .055, step(.0031308, c)); }
      void main(){
        vec2 d = vUv - .5; float r2 = dot(d, d);
        vec3 c = vgAces(texture2D(tDiffuse, vUv).rgb);
        if(ca > 0.){ c.r = vgAces(texture2D(tDiffuse, vUv + d*ca*r2*8.).rgb).r; c.b = vgAces(texture2D(tDiffuse, vUv - d*ca*r2*8.).rgb).b; }
        c *= 1. - vig*smoothstep(.08, .55, r2);
        if(grain > 0.){ vec3 p = pow(c, vec3(1./2.2)); p += (vgHash(vUv*1000. + time) - .5)*grain; c = pow(clamp(p, 0., 1.), vec3(2.2)); }
        c = clamp(c, 0., 1.);
        gl_FragColor = vec4(encode > .5 ? vgSrgb(c) : c, 1.); }`};
  return {LOOK, spaceEnv, rig, GradeShader};
})();
const Assets = (()=>{
  // SPEC-09b F2-06: 本当に光る物は線形値を 1 超(HDR)にし、bloom(閾値1.0)が発光体だけを拾うようにする
  const hdr = (hex, k)=>new THREE.Color(hex).multiplyScalar(k);
  // 岩の頂点変位(seed付き再現性): 大起伏(sin合成) + クレーター凹み(AST-01/02)
  function deformRock(geo, seed){
    let s = seed>>>0;
    const rnd = ()=>((s = (s*1664525 + 1013904223)>>>0) / 4294967296);
    const dirs = [], amp = [], ph = [];
    for(let i = 0; i < 4; i++){
      dirs.push(new THREE.Vector3(rnd()*4-2, rnd()*4-2, rnd()*4-2));
      ph.push(rnd()*6.283); amp.push(.05 + .09*rnd());
    }
    const craters = [];
    const nC = 4 + Math.floor(rnd()*4);
    for(let i = 0; i < nC; i++) craters.push({
      d: new THREE.Vector3(rnd()-.5, rnd()-.5, rnd()-.5).normalize(),
      depth: .07 + .09*rnd(), cos: .80 + .08*rnd()});
    const pos = geo.attributes.position, v = new THREE.Vector3();
    for(let i = 0; i < pos.count; i++){
      v.fromBufferAttribute(pos, i);
      const n = v.clone().normalize();
      let k = 1;
      for(let j = 0; j < 4; j++) k += amp[j]*Math.sin(n.dot(dirs[j])*3 + ph[j]);
      for(const c of craters){
        const d = n.dot(c.d);
        if(d > c.cos) k -= c.depth*((d - c.cos)/(1 - c.cos));
      }
      v.setLength(Math.max(.4, k));
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;

  // ===== SPEC-09d: 岩の表面(シード付き・継ぎ目なし)。高さ → アルベド/法線(Sobel)/粗さ を同じ模様から派生 =====
  const srng = seed=>{ let a = seed >>> 0;
    return ()=>{ a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; };
  function rockHeightCanvas(size, seed){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = srng(seed);
    g.fillStyle = '#808080'; g.fillRect(0, 0, size, size);
    // 端をまたぐ円は反対側にも描いてタイル状に継ぎ目なくする(トライプラナーで繰り返すため)
    const wrapped = (x, y, rad, paint)=>{
      for(const ox of [-size, 0, size]) for(const oy of [-size, 0, size]){
        const px = x + ox, py = y + oy;
        if(px + rad < 0 || px - rad > size || py + rad < 0 || py - rad > size) continue;
        paint(px, py);
      } };
    for(let o = 0; o < 5; o++){   // 多オクターブのまだら
      const n = 30 << o, cell = size/Math.sqrt(n);
      for(let i = 0; i < n; i++){
        const x = r()*size, y = r()*size, rad = cell*(.4 + r()*.9);
        g.fillStyle = r() < .5 ? `rgba(255,255,255,${.07/(o+1)})` : `rgba(0,0,0,${.09/(o+1)})`;
        wrapped(x, y, rad, (px, py)=>{ g.beginPath(); g.arc(px, py, rad, 0, 7); g.fill(); });
      }
    }
    for(let i = 0; i < 60; i++){   // クレーター(底が凹み、縁が盛り上がる)
      const x = r()*size, y = r()*size, rad = size*(.008 + Math.pow(r(), 2.2)*.06);
      wrapped(x, y, rad*1.25, (px, py)=>{
        const rg = g.createRadialGradient(px, py, 0, px, py, rad*1.25);
        rg.addColorStop(0, 'rgba(0,0,0,.55)'); rg.addColorStop(.72, 'rgba(0,0,0,.18)');
        rg.addColorStop(.86, 'rgba(255,255,255,.28)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(px, py, rad*1.25, 0, 7); g.fill();
      });
    }
    const id = g.getImageData(0, 0, size, size), d = id.data;   // 微細な粒
    for(let i = 0; i < d.length; i += 4){ const nn = (r() - .5)*26; d[i] += nn; d[i+1] += nn; d[i+2] += nn; }
    g.putImageData(id, 0, 0);

    ]), new THREE.MeshBasicMaterial({color:hdr(0x7df1ff, 1.8), transparent:true, opacity:.9,
      blending:THREE.AdditiveBlending, depthWrite:false}));
    // F6-03: 排気は球状スプライト → プルーム(scale.y が長さ。既存の速度連動・Sortie のコードはそのまま動く)
    const plumeMat = plumeMaterial();
    const ex1 = new THREE.Mesh(_plumeGeo, plumeMat), ex2 = new THREE.Mesh(_plumeGeo, plumeMat);
    ex1.rotation.x = ex2.rotation.x = Math.PI/2;   // +y(長さ) を機体後方 +z へ
    ex1.position.set(-1.6, -.15, 3.3); ex2.position.set(1.6, -.15, 3.3);
    const tipL = new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, color:hdr(0xff4455, 1.5),
      transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false}));
    const tipR = new THREE.Sprite(new THREE.SpriteMaterial({map:starTex, color:hdr(0x55ff88, 1.5),
      transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false}));
    tipL.position.set(-3.75, -.4, 1.2); tipR.position.set(3.75, -.4, 1.2);
    tipL.scale.setScalar(1.1); tipR.scale.setScalar(1.1);
    group.add(nozzles, nozzleGlow, ex1, ex2, tipL, tipR);
    return {group, parts:{nozzles, nozzleGlow, exhaust:[ex1, ex2], tips:[tipL, tipR], hull, plumeMat}};
  }
  return {deformRock, makeRockTex, mergeGeo, rockGeos, rockMats, buildCore, buildShip,
          rockSurface, setTriplanar, ROCK_TYPES,
          rockHull, SHIP_SPHERES, HIT_LENIENCY, shipSpheresWorld, clearance};
})();
return {Assets, Look, starTex};
})();

// ===== 共通: 決定的な配置 =====
let seed = 7; const rnd = ()=>((seed = (seed*1664525 + 1013904223)>>>0)/4294967296);
const LAYOUT = [{x:-9, y:2.5, z:-26, s:6.2, g:5}, {x:11, y:-4, z:-44, s:5.2, g:2}, {x:-3, y:7, z:-74, s:7.5, g:1}, {x:6, y:3, z:-18, s:2.2, g:3}];
for(let i = 0; i < 34; i++) LAYOUT.push({x:(rnd()-.5)*110, y:(rnd()-.5)*80, z:-60 - rnd()*820, s:2 + rnd()*6, g:i%8});
const SPINS = LAYOUT.map(()=>({x:(rnd()-.5)*.5, y:(rnd()-.5)*.5, z:(rnd()-.5)*.4}));
function makeStars(){
  const n = 3000, p = new Float32Array(n*3);
  for(let i = 0; i < n; i++){ const u = rnd()*2 - 1, a = rnd()*6.283, r = 900, q = Math.sqrt(1 - u*u);
    p[i*3] = Math.cos(a)*q*r; p[i*3+1] = u*r; p[i*3+2] = Math.sin(a)*q*r; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({size:1.4, color:0xcfe4ff, sizeAttenuation:false, fog:false, transparent:true, opacity:.8}));
}

// ===== BEFORE の世界(当時の本番と同じ照明・合成) =====
function buildBefore(R){
  const A = Old.Assets, S = new THREE.Scene();
  S.background = new THREE.Color(0x020010); S.fog = new THREE.FogExp2(0x020010, .0035);
  S.add(makeStars());
  S.add(new THREE.AmbientLight(0x445577, 2));
  const key = new THREE.DirectionalLight(0xaaccff, 2.4); key.position.set(40, 60, 30); S.add(key);
  const sb = A.buildShip(); S.add(sb.group);
  const geos = A.rockGeos(), mats = A.rockMats();
  const rocks = LAYOUT.map((L, i)=>{ const m = new THREE.Mesh(geos[L.g], mats[i%3]); m.position.set(L.x, L.y, L.z); m.scale.setScalar(L.s); S.add(m); return m; });
  const core = A.buildCore(); core.position.set(3.5, 1.2, -36); S.add(core);
  const pl = new THREE.Mesh(new THREE.SphereGeometry(140, 28, 22), new THREE.MeshStandardMaterial({color:0x5b46c8, emissive:0x180f40, roughness:.85, metalness:.1, fog:false}));
  pl.position.set(-270, -70, -1370); S.add(pl);
  const hl = new THREE.SpotLight(0xcce9ff, 420, 165, .58, .8, 1.5), hlT = new THREE.Object3D();
  hl.position.set(0, .4, -7); hlT.position.set(0, 0, -95); hl.target = hlT; S.add(hl, hlT);
  const comp = new EffectComposer(R);
  comp.addPass(new RenderPass(S, cam));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(512, 512), .85, .6, .62));
  // 当時の最終出力(AfterimagePass の MeshBasic コピー)と同じ sRGB 化のみ
  comp.addPass(new ShaderPass({uniforms:{tDiffuse:{value:null}},
    vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`uniform sampler2D tDiffuse; varying vec2 vUv;
      vec3 s(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1./2.4)) - .055, step(.0031308, c)); }
      void main(){ gl_FragColor = vec4(s(clamp(texture2D(tDiffuse, vUv).rgb, 0., 1.)), 1.); }`}));
  return {S, comp, ship: sb.group, parts: sb.parts, rocks, core};
}

// ===== AFTER の世界(本番と同じ Look・材質・合成) =====
function buildAfter(R){
  const A = New.Assets, L = New.Look, S = new THREE.Scene();
  S.background = new THREE.Color(L.LOOK.fog); S.fog = new THREE.FogExp2(L.LOOK.fog, .0026);
  S.add(makeStars());
  const rig = L.rig(S); S.environment = L.spaceEnv(R);
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  rig.key.castShadow = true; rig.key.shadow.mapSize.set(1024, 1024); rig.key.shadow.bias = -.0004; rig.key.shadow.normalBias = .03;
  Object.assign(rig.key.shadow.camera, {left:-45, right:45, top:45, bottom:-45, near:1, far:260});
  rig.key.position.copy(L.LOOK.keyDir).normalize().multiplyScalar(120);
  const sb = A.buildShip(); S.add(sb.group);
  sb.group.traverse(o=>{ if(o.isMesh && !o.material.transparent){ o.castShadow = true; o.receiveShadow = true; } });
  const geos = A.rockGeos(), mats = A.rockMats();
  const rocks = LAYOUT.map((Lr, i)=>{ const m = new THREE.Mesh(geos[Lr.g], mats[i%3]); m.position.set(Lr.x, Lr.y, Lr.z); m.scale.setScalar(Lr.s);
    m.receiveShadow = true; m.castShadow = i < 8; S.add(m); return m; });
  const core = A.buildCore(); core.position.set(3.5, 1.2, -36); S.add(core);
  const pl = new THREE.Mesh(new THREE.SphereGeometry(140, 48, 32), new THREE.MeshStandardMaterial({color:0x5b46c8, roughness:.9, metalness:0, envMapIntensity:.2, fog:false}));
  pl.position.set(-270, -70, -1370); S.add(pl);
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(149, 48, 32), new THREE.ShaderMaterial({transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`varying vec3 n; varying vec3 v; void main(){ n = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); v = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 n; varying vec3 v; void main(){ float f = pow(1. - abs(dot(n, v)), 3.); gl_FragColor = vec4(vec3(.55,.45,1.)*f*1.4, f); }`}));
  atmo.position.copy(pl.position); S.add(atmo);
  const hl = new THREE.SpotLight(0xcce9ff, 420, 165, .58, .8, 1.5), hlT = new THREE.Object3D();
  hl.position.set(0, .4, -7); hlT.position.set(0, 0, -95); hl.target = hlT; S.add(hl, hlT);
  const comp = new EffectComposer(R);
  comp.addPass(new RenderPass(S, cam));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(512, 512), .45, .3, 1.0));
  const grade = new ShaderPass(L.GradeShader); grade.uniforms.encode.value = 1;   // ACES+仕上げ+sRGB(サイトPCと同じ最終パス)
  comp.addPass(grade);
  return {S, comp, ship: sb.group, parts: sb.parts, rocks, core, grade};
}

const cam = new THREE.PerspectiveCamera(72, 1, .1, 1500);
function makePane(id, build){
  const R = new THREE.WebGLRenderer({canvas: document.getElementById(id), antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio, 2));
  return {R, W: build(R)};
}
const A = makePane('ca', buildBefore), B = makePane('cb', buildAfter);
window.BEFORE_AFTER = {A, B, cam, THREE};

let view = 'split', camMode = 'chase', paused = false, t = 0;
function resize(){
  const w = view === 'split' ? innerWidth/2 : innerWidth, h = innerHeight;
  for(const p of [A, B]){ p.R.setSize(w, h, false); p.W.comp.setSize(w, h); }
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
document.querySelectorAll('[data-v]').forEach(b=>b.onclick = ()=>{ view = b.dataset.v;
  document.body.className = view === 'split' ? '' : 'only-' + view;
  document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on', x === b)); resize(); });
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick = ()=>{ camMode = b.dataset.cam;
  document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('on', x === b)); });
document.getElementById('pause').onclick = e=>{ paused = !paused; e.target.textContent = paused ? '再生' : '一時停止'; };

function step(tt){
  for(const p of [A, B]){ const W = p.W;
    W.ship.position.set(Math.sin(tt*.6)*2.2, Math.sin(tt*.9)*.8, 0);
    W.ship.rotation.z = -Math.cos(tt*.6)*.35; W.ship.rotation.x = Math.cos(tt*.9)*.06;
    W.rocks.forEach((m, i)=>{ const s = SPINS[i]; m.rotation.set(i*.7 + tt*s.x, i*1.3 + tt*s.y, i*.4 + tt*s.z); });
    W.core.userData.ring1.rotation.y = tt*1.8; W.core.userData.ring2.rotation.x = -tt*1.2;
    const k = .35 + .25*Math.sin(tt*.4);
    W.parts.exhaust.forEach(e=>e.scale.set(.9 + .6*k, 1.6 + 3.2*k, 1));
    if(W.parts.plumeMat){ W.parts.plumeMat.uniforms.time.value = tt; W.parts.plumeMat.uniforms.strength.value = .45 + .55*k; }
    if(W.grade) W.grade.uniforms.time.value = tt;
  }
  if(camMode === 'chase'){ cam.position.set(Math.sin(tt*.6)*2.2*.9, 4 + Math.sin(tt*.9)*.3, 17); cam.lookAt(0, 0, -60); }
  else if(camMode === 'close'){ const r0 = LAYOUT[0]; cam.position.set(r0.x + 13*Math.cos(tt*.25), r0.y + 4, r0.z + 13*Math.sin(tt*.25) + 4); cam.lookAt(r0.x, r0.y, r0.z); }
  else { cam.position.set(6*Math.cos(tt*.3), 2.5, 6*Math.sin(tt*.3) + 1); cam.lookAt(0, 0, .5); }
}
window.BEFORE_AFTER.step = step;
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if(!paused) t += dt;
  step(t);
  if(view !== 'b') A.W.comp.render();
  if(view !== 'a') B.W.comp.render();
}
resize(); requestAnimationFrame(loop);
</script>
